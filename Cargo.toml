[package]
name = "fergit"
version = "0.1.0"
edition = "2024"
# Let-chains, used in the picker state machine, need this.
rust-version = "1.88"
description = "Interactive git add, branch switch and cherry-pick, with a built-in fuzzy picker"
repository = "https://github.com/Pajn/fergit"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["git", "cli", "tui", "fuzzy", "interactive"]
categories = ["command-line-utilities", "development-tools"]

# Where `cargo binstall` looks for a prebuilt binary. These templates have to
# agree with how .github/workflows/release.yml names its archives.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
git2 = { version = "0.21.0", default-features = false }
lexopt = "0.3.2"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
thiserror = "2.0.20"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Unwinding is deliberate: the picker restores the terminal from a Drop
# implementation, and aborting on panic would skip it and leave the terminal
# in raw mode.
